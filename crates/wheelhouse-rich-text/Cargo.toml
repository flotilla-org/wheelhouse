[package]
name = "wheelhouse-rich-text"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# The synthetic markdown generator (generate), for other crates' tests.
test-support = []

[dependencies]
wheelhouse-stream.workspace = true
# Markdown ingest, and its HTML copy.
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
hegeltest = "0.49.2"
insta = "1"
