[package]
name = "wheelhouse-text"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native paragraph layout over parley and fontique"

[features]
default = ["complex-scripts"]
# Line breaking for Thai, Lao, Khmer and Burmese (ICU4X's dictionaries and
# LSTM models, about 3 MB): without it, those scripts break only where a
# word overflows the line.
complex-scripts = ["parley/complex-scripts"]

[dependencies]
# Pinned: the layout's cluster model (one cluster per grapheme) is 0.12's.
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
# fontconfig is opened at run time, so native links nothing new on Linux.
fontique = { version = "=0.12.0", features = ["fontconfig-dlopen"] }
read-fonts = "0.41"

[dev-dependencies]
hegeltest = "0.49.2"
insta.workspace = true

# The parity test (tests/parity.rs) asks each platform's own fallback; these
# are the versions fontique already builds with.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFString", "CFURL", "CFCGTypes"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFont", "CTFontDescriptor"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite"] }
# `#[implement]` names it.
windows-core = "0.62.2"

[[bench]]
name = "layout"
harness = false
