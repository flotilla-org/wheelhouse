[package]
name = "wheelhouse-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The sidebar core for the browser: the change stream and intents as JS objects, with generated TypeScript types"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
wheelhouse-core.workspace = true

[dev-dependencies]
hegeltest = "0.49.2"
wheelhouse-core = { workspace = true, features = ["test-support"] }
