[package]
name = "wheelhouse-ingress"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Wheelhouse's HTTP ingress: queues producer payloads for the native UI thread through a C boundary (include/ingress.h)."

[lib]
name = "wheelhouse_ingress"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[target.'cfg(any(unix, windows))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
