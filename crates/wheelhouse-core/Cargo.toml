[package]
name = "wheelhouse-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Shared test generators (arrangement::generate), for the oracle crate too.
test-support = ["dep:hegeltest"]

[dependencies]
foldhash = "0.2"
kdl = { version = "4.7.1", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
unicode-width = "0.1.14"
# Rich Text (#558): markdown ingest, and its HTML copy.
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }
hegeltest = { version = "0.49.2", optional = true }

[dev-dependencies]
hegeltest = "0.49.2"
insta = "1"
