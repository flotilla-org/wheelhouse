[package]
name = "wheelhouse-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Shared test generators (arrangement::generate), for the oracle crate too.
test-support = ["dep:hegeltest"]

[dependencies]
foldhash = "0.2"
kdl = { version = "4.7.1", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
unicode-width = "0.1.14"
wheelhouse-stream.workspace = true
hegeltest = { version = "0.49.2", optional = true }

[dev-dependencies]
hegeltest = "0.49.2"
insta = "1"
