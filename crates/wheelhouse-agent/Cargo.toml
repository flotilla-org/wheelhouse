[package]
name = "wheelhouse-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A client of the Agent View protocol (wheelhouse#691): watch a thread, page its history, send it input"

[dependencies]
conversation-events.workspace = true
flotilla-cbor.workspace = true
rigging-http-client.workspace = true
rigging-http-wire.workspace = true
reqwest = { version = "0.13", default-features = false }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
futures-util = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
serde = { workspace = true }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
