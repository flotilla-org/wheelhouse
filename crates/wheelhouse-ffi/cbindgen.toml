# include/wheelhouse.h is generated from this crate's source by cbindgen:
# scripts/generate-header.sh writes it, and --check fails when it is stale.
# Edit the Rust doc comments, or this file, not the header.
language = "C"
include_guard = "WHEELHOUSE_H"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
cpp_compat = true
documentation_style = "c99"
style = "type"
usize_is_size_t = true
autogen_warning = """/* Generated by cbindgen from crates/wheelhouse-ffi (scripts/generate-header.sh); do not edit. */"""
header = """/*
 * The core's C ABI. docs/core/sidebar-design/host-interface.md describes it as
 * a whole; each declaration's comment gives its contract.
 *
 * Calls on one sidebar are serialised by the host. Input pointers and
 * arrays are borrowed for the call only; NULL input pointers require zero
 * length, and others must be valid and aligned for their length. Handles
 * are live allocations from this library, or NULL; never use one after
 * releasing it. Tags are uint32_t, not C enums.
 *
 * A call that mutates returns 1 on success and 0 on error, and changes
 * nothing on invalid input. error_out, when not NULL, is cleared on entry
 * and receives an owned NUL-terminated message on error; free it with
 * wheelhouse_string_free. A panic poisons the sidebar: destroy and recreate
 * it. Getters return 0 for NULL handles or output and for invalid indices,
 * leaving the output untouched.
 */"""
after_includes = """

// An index that names nothing.
#define WHEELHOUSE_NONE SIZE_MAX

// binnacle's Grid (binnacle.h), which this library includes and exports.
typedef struct BinnacleGrid BinnacleGrid;"""

[export.rename]
"Text" = "WheelhouseText"
"Bytes" = "WheelhouseBytes"
"WorkspaceIdView" = "WheelhouseWorkspaceId"
"EntityView" = "WheelhouseEntity"
"Fact" = "WheelhouseFact"
"LocalFact" = "WheelhouseLocalFact"
"WorkspaceInput" = "WheelhouseWorkspace"
"PaneInput" = "WheelhousePane"
"WorkdirInput" = "WheelhouseWorkdir"
"NodeView" = "WheelhouseNode"
"FieldView" = "WheelhouseField"
"ControlView" = "WheelhouseControl"
"CardView" = "WheelhouseCardInfo"
"CardActionView" = "WheelhouseCardAction"
"CardRelationView" = "WheelhouseCardRelation"
"DetailFieldView" = "WheelhouseDetailField"
"EffectView" = "WheelhouseEffect"
"DeltaOpView" = "WheelhouseDeltaOp"
"StreamNodeView" = "WheelhouseStreamNode"
"ListOpView" = "WheelhouseListOp"
"DisplayVariableView" = "WheelhouseDisplayVariable"
"ActivationErrorView" = "WheelhouseActivationError"
"IntentView" = "WheelhouseIntent"
"ViewSpecView" = "WheelhouseViewSpec"
"SlotView" = "WheelhouseSlot"
"SlotListView" = "WheelhouseSlots"
"SlotContentView" = "WheelhouseSlotContent"
"ResolutionFieldView" = "WheelhouseResolutionField"
"ResolutionView" = "WheelhouseResolution"
"OverlayNoteView" = "WheelhouseOverlayNote"
"OverlayView" = "WheelhouseOverlay"
"LocalEntityView" = "WheelhouseLocalEntity"
"SiblingOrderView" = "WheelhouseSiblingOrder"
"DashboardView" = "WheelhouseDashboard"
# wheelhouse-text's output arrays, which wh_text_layout writes as they are.
"Line" = "WhTextLine"
"Run" = "WhTextRun"
"Glyph" = "WhTextGlyph"
"Cluster" = "WhTextCluster"
"PlacedBox" = "WhTextBox"
"Rect" = "WhTextRect"
"Segment" = "WhTextSegment"

[export]
# Only its slot numbers cross the ABI.
exclude = ["Family"]

[parse]
# wheelhouse-text defines the repr(C) arrays a text layout writes.
parse_deps = true
include = ["wheelhouse-text"]

[fn]
sort_by = "None"
