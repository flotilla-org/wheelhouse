[package]
name = "wheelhouse-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["json"]
json = ["dep:serde_json"]

[dependencies]
wheelhouse-core = { path = "../wheelhouse-core" }
wheelhouse-tables.workspace = true
binnacle-core.workspace = true
binnacle-ffi.workspace = true
wheelhouse-text.workspace = true
serde_json = { version = "1", optional = true }

[dev-dependencies]
hegeltest = "0.49.2"
wheelhouse-core = { path = "../wheelhouse-core", features = ["test-support"] }
