name: Sidebar memory regression

# Native sidebar benchmark with an RSS ceiling and growth gate (#195, #199):
# a scheduled and on-demand regression check, not a required gate. Pins come from ci/pins.toml, as in
# build.yml, so the two workflows cannot drift.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sidebar-memory.yml
      - tools/benchmark-sidebar.py
      - native/src/uishell/uishell_sidebar_benchmark.c

permissions:
  contents: read

concurrency:
  group: sidebar-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidebar-memory:
    name: Scheduled sidebar memory regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WHEELHOUSE_CLEAT_FEATURES: none
      LIBGL_ALWAYS_SOFTWARE: '1'
    defaults:
      run:
        working-directory: wheelhouse
    steps:
      - uses: actions/checkout@v4
        with:
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read dependency pins from ci/pins.toml
        run: python ci/pins.py github-env >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/cleat
          ref: ${{ env.CLEAT_REV }}
          path: cleat
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/jackstay
          ref: ${{ env.JACKSTAY_REV }}
          path: jackstay
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build, display and measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libx11-dev libxext-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype6-dev xvfb xauth time
      - name: Build release binary
        run: bash native/build.sh wheelhouse release
      - name: Sidebar memory regression
        run: xvfb-run -a python3 tools/benchmark-sidebar.py --sizes 100 300 1000 --output build/sidebar-benchmark
      - name: Retain complete and partial benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheelhouse/build/sidebar-benchmark/*.log
          if-no-files-found: warn
