name: Native builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  # Includes the bundled Windows ConPTY from cleat PR #235 (ADR 0006), which
  # build.bat stages beside wheelhouse.exe so panes pass Kitty graphics through.
  CLEAT_REV: adeb033cec5d001aaf4bc6f3f288dd24dbe892cc
  JACKSTAY_REV: b992ad28b2eb56b9b292570b2cfbed5b2beaeb0c
  ANDAMENTO_REV: 6b6435e40ccda2cd39f02847380875e7e21d1834

jobs:
  daily-driver:
    name: Daily-driver lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test-daily-driver.py
      - run: python3 tools/test-build-failures.py
      - run: bash -n scripts/run-daily-driver.sh

  native:
    name: ${{ matrix.os }} / ${{ matrix.vt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            vt: none
          - os: windows-2022
            vt: ghostty-vt
          - os: macos-14
            vt: ghostty-vt
    env:
      WHEELHOUSE_CLEAT_FEATURES: ${{ matrix.vt }}
    defaults:
      run:
        working-directory: wheelhouse
    steps:
      - uses: actions/checkout@v4
        with:
          path: wheelhouse
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/cleat
          ref: ${{ env.CLEAT_REV }}
          path: cleat
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
        with:
          repository: flotilla-org/jackstay
          ref: ${{ env.JACKSTAY_REV }}
          path: jackstay
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/andamento
          ref: ${{ env.ANDAMENTO_REV }}
          path: andamento
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libx11-dev libxext-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype6-dev xvfb xauth
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: mlugg/setup-zig@v2
        if: matrix.vt == 'ghostty-vt'
        with:
          version: 0.16.0
      - name: Prepare Ghostty
        if: matrix.vt == 'ghostty-vt' && runner.os != 'Windows'
        run: bash ../cleat/tools/prepare-ghostty-vt.sh
      - name: Prepare Ghostty on Windows
        if: matrix.vt == 'ghostty-vt' && runner.os == 'Windows'
        shell: pwsh
        run: ../cleat/tools/prepare-ghostty-vt.ps1
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        # `meta` rebuilds metagen so the generated-sources check covers its output.
        run: call build.bat wheelhouse meta
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: bash build.sh wheelhouse
      - name: Build and verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          bash build.sh bundle
          codesign --verify --deep --strict build/Wheelhouse.app
      - name: Verify generated sources
        run: python tools/check-generated.py
      - name: Windows UI diagnostics
        if: runner.os == 'Windows'
        shell: cmd
        run: call run_tests.bat
      - name: Windows ConPTY packaging
        if: runner.os == 'Windows'
        shell: pwsh
        # An in-process pane must run under the bundled OpenConsole.exe beside
        # wheelhouse.exe; the inbox run shows the check tells the two apart.
        run: |
          ./tools/check-windows-conpty.ps1 -Expect bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/check-windows-conpty.ps1 -Expect inbox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux UI diagnostics
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/user" --project:"$task_dir/project" --sidebar_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/scroll-user" --project:"$task_dir/scroll-project" --scroll_region_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/preview-user" --project:"$task_dir/preview-project" --preview_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/tooltip-user" --project:"$task_dir/tooltip-project" --tooltip_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/panel-user" --project:"$task_dir/panel-project" --panel_diagnostics
      - name: macOS UI diagnostics
        if: runner.os == 'macOS'
        run: |
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          ./build/wheelhouse --user:"$task_dir/user" --project:"$task_dir/project" --sidebar_diagnostics
          ./build/wheelhouse --user:"$task_dir/scroll-user" --project:"$task_dir/scroll-project" --scroll_region_diagnostics
          ./build/wheelhouse --user:"$task_dir/preview-user" --project:"$task_dir/preview-project" --preview_diagnostics
          ./build/wheelhouse --user:"$task_dir/tooltip-user" --project:"$task_dir/tooltip-project" --tooltip_diagnostics
          ./build/wheelhouse --user:"$task_dir/panel-user" --project:"$task_dir/panel-project" --panel_diagnostics
          ./build/wheelhouse --user:"$task_dir/managed-user" --project:"$task_dir/managed-project" --managed_content_diagnostics
          ./build/wheelhouse --user:"$task_dir/glyph-user" --project:"$task_dir/glyph-project" --terminal_glyph_diagnostics --terminal_glyph_fixture_ppm:"$task_dir/terminal.ppm"
          python3 tools/validate-terminal-fixture-ppm.py "$task_dir/terminal.ppm"
      - name: Jackstay media and input acceptance
        if: runner.os != 'Windows'
        run: python3 tools/test-jackstay.py
      - name: HTTP ingress and native producer checks
        if: runner.os != 'Windows'
        shell: bash
        env:
          WHEELHOUSE_TEST_BINARY: build/wheelhouse
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$RUNNER_OS" = Linux ]; then
            python3 tools/test-native-sidebar.py "../andamento/target/$host/debug/libandamento_ffi.so"
            xvfb-run -a python3 tools/test-andamento-ingress.py "../andamento/target/$host/debug"
          else
            python3 tools/test-native-sidebar.py "../andamento/target/$host/debug/libandamento_ffi.dylib"
            python3 tools/test-andamento-ingress.py "../andamento/target/$host/debug"
          fi
