name: Native builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  # Includes attachment-local panning and shared PTY bounds from cleat PR #212.
  CLEAT_REV: c5eaa36c2d1dfbe8d18f5fdf946bd279b384a8cc
  JACKSTAY_REV: 286762abd5dfe077b3d39b123868e4c4e843e08a
  ANDAMENTO_REV: f8c63862e997f1e95fa80b264755e9ad270ab9ee

jobs:
  daily-driver:
    name: Daily-driver lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test-daily-driver.py
      - run: bash -n scripts/run-daily-driver.sh

  native:
    name: ${{ matrix.os }} / ${{ matrix.vt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            vt: none
          - os: windows-2022
            vt: none
          - os: macos-14
            vt: ghostty-vt
    env:
      WHEELHOUSE_CLEAT_FEATURES: ${{ matrix.vt }}
    defaults:
      run:
        working-directory: wheelhouse
    steps:
      - uses: actions/checkout@v4
        with:
          path: wheelhouse
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/cleat
          ref: ${{ env.CLEAT_REV }}
          path: cleat
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
        with:
          repository: flotilla-org/jackstay
          ref: ${{ env.JACKSTAY_REV }}
          path: jackstay
      # Fork PRs lack the App secret; fail explicitly because Andamento is private.
      - name: Check private dependency access
        shell: bash
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
          CI_APP_ID: ${{ vars.CI_APP_ID }}
        run: |
          if [ -z "$CI_APP_PRIVATE_KEY" ] || [ -z "$CI_APP_ID" ]; then
            echo '::error::Configure CI_APP_ID and CI_APP_PRIVATE_KEY for the read-only CI App installed on andamento.'
            exit 1
          fi
      - name: Create read-only dependency token
        uses: actions/create-github-app-token@v2
        id: dependency-token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: flotilla-org
          repositories: andamento
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/andamento
          ref: ${{ env.ANDAMENTO_REV }}
          path: andamento
          token: ${{ steps.dependency-token.outputs.token }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libx11-dev libxext-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype6-dev xvfb xauth
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: mlugg/setup-zig@v2
        if: matrix.vt == 'ghostty-vt'
        with:
          version: 0.16.0
      - name: Prepare Ghostty
        if: matrix.vt == 'ghostty-vt'
        run: bash ../cleat/tools/prepare-ghostty-vt.sh
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call build.bat wheelhouse
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: bash build.sh wheelhouse
      - name: Build and verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          bash build.sh bundle
          codesign --verify --deep --strict build/Wheelhouse.app
      - name: Verify generated sidebar fixture
        shell: bash
        run: git diff --exit-code -- src/uishell/generated/sidebar_fixture.h
      - name: Linux UI diagnostics
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/user" --project:"$task_dir/project" --sidebar_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/scroll-user" --project:"$task_dir/scroll-project" --scroll_region_diagnostics
      - name: macOS UI diagnostics
        if: runner.os == 'macOS'
        run: |
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          ./build/wheelhouse --user:"$task_dir/user" --project:"$task_dir/project" --sidebar_diagnostics
          ./build/wheelhouse --user:"$task_dir/scroll-user" --project:"$task_dir/scroll-project" --scroll_region_diagnostics
          ./build/wheelhouse --user:"$task_dir/glyph-user" --project:"$task_dir/glyph-project" --terminal_glyph_diagnostics --terminal_glyph_fixture_ppm:"$task_dir/terminal.ppm"
          python3 tools/validate-terminal-fixture-ppm.py "$task_dir/terminal.ppm"
      - name: Jackstay media and input acceptance
        if: runner.os != 'Windows'
        run: python3 tools/test-jackstay.py
      - name: HTTP ingress and native producer checks
        if: runner.os != 'Windows'
        shell: bash
        env:
          WHEELHOUSE_TEST_BINARY: build/wheelhouse
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$RUNNER_OS" = Linux ]; then
            python3 tools/test-native-sidebar.py "../andamento/target/$host/debug/libandamento_ffi.so"
            xvfb-run -a python3 tools/test-andamento-ingress.py "../andamento/target/$host/debug"
          else
            python3 tools/test-native-sidebar.py "../andamento/target/$host/debug/libandamento_ffi.dylib"
            python3 tools/test-andamento-ingress.py "../andamento/target/$host/debug"
          fi
