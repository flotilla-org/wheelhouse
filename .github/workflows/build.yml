name: Native builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  # Live clipboard effects (#304): provider ABI 11 and packet protocol 12.
  # This also carries #298/#299/#303. Protocol-11 daemons are rejected:
  # coordinate the Cleat fleet and Wheelhouse daily-driver rollout (#97).
  CLEAT_REV: 00c072b207dc943f6c93fe3b6b09abaa257695a6
  # D3D11 frames in the C ABI (0.10, jackstay#46) and a host's own exchange
  # before setup (0.11, jackstay#48, which Porthole capture sessions need).
  # Pinned to jackstay#48's branch commit until it merges; then its squash commit.
  JACKSTAY_REV: 91156bfac2bc2f6df168c928b445c98e002f4950
  ANDAMENTO_REV: b72a103f41424f4ee7caef15f1b1a89532dab990

jobs:
  daily-driver:
    name: Daily-driver lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/test-daily-driver.py
      - run: python3 tools/test-build-failures.py
      - run: python3 tools/test-windows-terminal-input-readiness.py
      - run: bash -n scripts/run-daily-driver.sh

  native:
    name: ${{ matrix.os }} / ${{ matrix.vt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            vt: none
          - os: windows-2022
            vt: ghostty-vt
          - os: macos-14
            vt: ghostty-vt
    env:
      WHEELHOUSE_CLEAT_FEATURES: ${{ matrix.vt }}
    defaults:
      run:
        working-directory: wheelhouse
    steps:
      - uses: actions/checkout@v4
        with:
          path: wheelhouse
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/cleat
          ref: ${{ env.CLEAT_REV }}
          path: cleat
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/jackstay
          ref: ${{ env.JACKSTAY_REV }}
          path: jackstay
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/andamento
          ref: ${{ env.ANDAMENTO_REV }}
          path: andamento
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libx11-dev libxext-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype6-dev xvfb xauth
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: mlugg/setup-zig@v2
        if: matrix.vt == 'ghostty-vt'
        with:
          version: 0.16.0
      - name: Prepare Ghostty
        if: matrix.vt == 'ghostty-vt' && runner.os != 'Windows'
        run: bash ../cleat/tools/prepare-ghostty-vt.sh
      - name: Prepare Ghostty on Windows
        if: matrix.vt == 'ghostty-vt' && runner.os == 'Windows'
        shell: pwsh
        run: ../cleat/tools/prepare-ghostty-vt.ps1
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        # `meta` rebuilds metagen so the generated-sources check covers its output.
        run: call build.bat wheelhouse meta
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: bash build.sh wheelhouse
      - name: Build and verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          bash build.sh bundle
          codesign --verify --deep --strict build/Wheelhouse.app
      - name: Verify generated sources
        run: python tools/check-generated.py
      - name: Headless terminal clipboard effects
        if: runner.os != 'Windows'
        run: ./build/wheelhouse --terminal_clipboard_diagnostics
      - name: Windows UI diagnostics
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call run_tests.bat
          if errorlevel 1 exit /b 1
          call run_tests.bat -Diagnostics preview -NoPreviewBudget
      - name: Windows ConPTY packaging
        if: runner.os == 'Windows'
        shell: pwsh
        # An in-process pane must run under the bundled OpenConsole.exe beside
        # wheelhouse.exe; the inbox run shows the check tells the two apart.
        run: |
          ./tools/check-windows-conpty.ps1 -Expect bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/check-windows-conpty.ps1 -Expect inbox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux UI diagnostics
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/shared-user" --project:"$task_dir/shared-project" --shared_ui_diagnostics --shared_ui_fixture_dir:"$task_dir"
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/selection-user" --project:"$task_dir/selection-project" --terminal_selection_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/user" --project:"$task_dir/project" --sidebar_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/scroll-user" --project:"$task_dir/scroll-project" --scroll_region_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/preview-user" --project:"$task_dir/preview-project" --preview_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/preview-control-user" --project:"$task_dir/preview-control-project" --preview_diagnostics --no_preview_refresh_budget --no_preview_surface_budget --no_preview_render_budget
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/link-user" --project:"$task_dir/link-project" --terminal_link_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/tooltip-user" --project:"$task_dir/tooltip-project" --tooltip_diagnostics
          timeout 120s xvfb-run -a ./build/wheelhouse --user:"$task_dir/panel-user" --project:"$task_dir/panel-project" --panel_diagnostics
      - name: Terminal launch environment
        shell: bash
        run: python tools/test-terminal-environment.py
      - name: macOS text positions
        if: runner.os == 'macOS'
        run: bash src/mac/font_provider/tests/run_text_positions.sh
      - name: macOS keyboard event regression
        if: runner.os == 'macOS'
        run: bash src/mac/window_manager/tests/run_key_events.sh
      - name: macOS scroll event regression
        if: runner.os == 'macOS'
        run: bash src/mac/window_manager/tests/run_scroll_events.sh
      - name: macOS UI diagnostics
        if: runner.os == 'macOS'
        run: |
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          ./build/wheelhouse --user:"$task_dir/shared-user" --project:"$task_dir/shared-project" --shared_ui_diagnostics --shared_ui_fixture_dir:"$task_dir"
          ./build/wheelhouse --user:"$task_dir/selection-user" --project:"$task_dir/selection-project" --terminal_selection_diagnostics
          ./build/wheelhouse --user:"$task_dir/user" --project:"$task_dir/project" --sidebar_diagnostics
          ./build/wheelhouse --user:"$task_dir/scroll-user" --project:"$task_dir/scroll-project" --scroll_region_diagnostics
          ./build/wheelhouse --user:"$task_dir/preview-user" --project:"$task_dir/preview-project" --preview_diagnostics
          ./build/wheelhouse --user:"$task_dir/preview-control-user" --project:"$task_dir/preview-control-project" --preview_diagnostics --no_preview_refresh_budget --no_preview_surface_budget --no_preview_render_budget
          ./build/wheelhouse --user:"$task_dir/link-user" --project:"$task_dir/link-project" --terminal_link_diagnostics
          ./build/wheelhouse --user:"$task_dir/tooltip-user" --project:"$task_dir/tooltip-project" --tooltip_diagnostics
          ./build/wheelhouse --user:"$task_dir/panel-user" --project:"$task_dir/panel-project" --panel_diagnostics
          ./build/wheelhouse --user:"$task_dir/managed-user" --project:"$task_dir/managed-project" --managed_content_diagnostics
          ./build/wheelhouse --user:"$task_dir/glyph-user" --project:"$task_dir/glyph-project" --terminal_glyph_diagnostics --terminal_glyph_fixture_ppm:"$task_dir/terminal.ppm"
          python3 tools/validate-terminal-fixture-ppm.py "$task_dir/terminal.ppm"
      - name: Windows terminal input regression
        if: runner.os == 'Windows'
        run: python tools/test-windows-terminal-input.py
      - name: Jackstay media and input acceptance
        # Local Endpoints: named pipes on Windows, Unix sockets elsewhere.
        run: python tools/test-jackstay.py
      - name: HTTP ingress and native producer checks
        shell: bash
        env:
          WHEELHOUSE_TEST_BINARY: build/wheelhouse
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$RUNNER_OS" = Windows ]; then
            python tools/test-andamento-ingress.py "../andamento/target/$host/debug"
          elif [ "$RUNNER_OS" = Linux ]; then
            python3 tools/test-native-sidebar.py "../andamento/target/$host/debug/libandamento_ffi.so"
            xvfb-run -a python3 tools/test-andamento-ingress.py "../andamento/target/$host/debug"
          else
            python3 tools/test-native-sidebar.py "../andamento/target/$host/debug/libandamento_ffi.dylib"
            python3 tools/test-andamento-ingress.py "../andamento/target/$host/debug"
          fi
