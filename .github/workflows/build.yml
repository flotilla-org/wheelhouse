name: Native builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-driver:
    name: Daily-driver lifecycle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test-daily-driver.py
      - run: python tools/test-daily-driver-windows.py
      - run: python3 tools/test-build-failures.py
        if: runner.os != 'Windows'
      - run: python tools/test-windows-terminal-input-readiness.py
      - run: python tools/test-embed-sidebar-fixture.py
      - run: python ci/test_pins.py
      - run: python3 ci/test_run_ui_diagnostics.py
        if: runner.os != 'Windows'
      - run: bash -n scripts/run-daily-driver.sh
        if: runner.os != 'Windows'

  native:
    name: ${{ matrix.os }} / ${{ matrix.vt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            vt: none
          - os: windows-2022
            vt: ghostty-vt
          - os: macos-15
            vt: ghostty-vt
    env:
      WHEELHOUSE_CLEAT_FEATURES: ${{ matrix.vt }}
    defaults:
      run:
        working-directory: wheelhouse
    steps:
      - uses: actions/checkout@v4
        with:
          path: wheelhouse
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read dependency pins from ci/pins.toml
        shell: bash
        run: python ci/pins.py github-env >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/cleat
          ref: ${{ env.CLEAT_REV }}
          path: cleat
      - uses: actions/checkout@v4
        with:
          repository: flotilla-org/jackstay
          ref: ${{ env.JACKSTAY_REV }}
          path: jackstay
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libx11-dev libxext-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype6-dev xvfb xauth
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Pin the MSVC linker for Cargo launched from Bash
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskMsvcCompiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $taskMsvcLinker = Join-Path (Split-Path $taskMsvcCompiler) 'link.exe'
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$taskMsvcLinker" >> $env:GITHUB_ENV
      - uses: mlugg/setup-zig@v2
        if: matrix.vt == 'ghostty-vt'
        with:
          version: 0.16.0
      - name: Prepare Ghostty
        if: matrix.vt == 'ghostty-vt' && runner.os != 'Windows'
        run: bash ../cleat/tools/prepare-ghostty-vt.sh
      - name: Prepare Ghostty on Windows
        if: matrix.vt == 'ghostty-vt' && runner.os == 'Windows'
        shell: pwsh
        run: ../cleat/tools/prepare-ghostty-vt.ps1
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        # `meta` rebuilds metagen so the generated-sources check covers its output.
        run: call native\build.bat wheelhouse meta
      - name: Build on Linux
        if: runner.os == 'Linux'
        # With CI set, native/build.sh also runs the headless harnesses against the
        # real core (crates/wheelhouse-ffi) and Cleat libraries: docking validity and integration,
        # and restart behaviour against golden logical-state snapshots
        # (tools/test-state-behaviour.py; goldens in native/src/uishell/tests/).
        run: bash native/build.sh wheelhouse
      - name: Build and verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          bash native/build.sh bundle
          codesign --verify --deep --strict build/Wheelhouse.app
      - name: Verify generated sources
        run: python tools/check-generated.py
      - name: Headless Jackstay viewport geometry
        run: python -c "import subprocess; subprocess.run(['./build/wheelhouse', '--jackstay_geometry_diagnostics'], check=True)"
      - name: Headless terminal clipboard effects
        if: runner.os != 'Windows'
        run: ./build/wheelhouse --terminal_clipboard_diagnostics
      - name: Windows UI diagnostics
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call native\run_tests.bat
          if errorlevel 1 exit /b 1
          call native\run_tests.bat -Diagnostics preview -NoPreviewBudget
      - name: Windows ConPTY packaging
        if: runner.os == 'Windows'
        shell: pwsh
        # An in-process pane must run under the bundled OpenConsole.exe beside
        # wheelhouse.exe; the inbox run shows the check tells the two apart.
        run: |
          ./tools/check-windows-conpty.ps1 -Expect bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/check-windows-conpty.ps1 -Expect inbox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux UI diagnostics
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python3 ci/run-ui-diagnostics.py --os linux
      - name: Terminal launch environment
        shell: bash
        run: python tools/test-terminal-environment.py
      - name: macOS text positions
        if: runner.os == 'macOS'
        run: bash native/src/mac/font_provider/tests/run_text_positions.sh
      - name: macOS keyboard event regression
        if: runner.os == 'macOS'
        run: bash native/src/mac/window_manager/tests/run_key_events.sh
      - name: macOS scroll event regression
        if: runner.os == 'macOS'
        run: bash native/src/mac/window_manager/tests/run_scroll_events.sh
      - name: macOS UI diagnostics
        if: runner.os == 'macOS'
        run: python3 ci/run-ui-diagnostics.py --os macos
      - name: Headless section placement lifecycle
        run: python tools/test-section-placement.py
      - name: Windows terminal input regression
        if: runner.os == 'Windows'
        run: python tools/test-windows-terminal-input.py
      - name: Jackstay media and input acceptance
        # Local Endpoints: named pipes on Windows, Unix sockets elsewhere.
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python3 tools/test-jackstay.py --ui-binary build/wheelhouse
          elif [ "$RUNNER_OS" = Windows ]; then
            python tools/test-jackstay.py --ui-binary build/wheelhouse.exe
          else
            python3 tools/test-jackstay.py --ui-binary build/wheelhouse
          fi
      - name: HTTP ingress and native producer checks
        shell: bash
        env:
          WHEELHOUSE_TEST_BINARY: build/wheelhouse
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$RUNNER_OS" = Windows ]; then
            python tools/test-ingress.py "target/$host/debug"
            python tools/test-table-startup.py
          elif [ "$RUNNER_OS" = Linux ]; then
            python3 tools/test-native-sidebar.py "target/$host/debug/libwheelhouse_ffi.so"
            xvfb-run -a python3 tools/test-ingress.py "target/$host/debug"
            xvfb-run -a python3 tools/test-table-startup.py
          else
            python3 tools/test-native-sidebar.py "target/$host/debug/libwheelhouse_ffi.dylib"
            python3 tools/test-ingress.py "target/$host/debug"
            python3 tools/test-table-startup.py
          fi
