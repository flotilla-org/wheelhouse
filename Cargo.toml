[workspace]
members = [
    "crates/wheelhouse-core",
    "crates/wheelhouse-rich-text",
    "crates/wheelhouse-stream",
    "crates/wheelhouse-arrangement-oracle",
    "crates/wheelhouse-glyph-cache",
    "crates/wheelhouse-ffi",
    "crates/wheelhouse-git-watcher",
    "crates/wheelhouse-html",
    "crates/wheelhouse-terminal",
    "crates/wheelhouse-tui",
    "crates/wheelhouse-ingress",
    "crates/wheelhouse-tables",
    "crates/wheelhouse-wasm",
    "crates/wheelhouse-text",
    "crates/conversation-events",
    "crates/wheelhouse-agent",
    "crates/wheelhouse-surface",
]
# tools/scenario is a workspace of its own: it pins Flotilla's crates by git
# revision, which normal builds shouldn't fetch.
exclude = ["tools/scenario"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# binnacle draws the tables (#505). Pinned by revision: the repos move together.
binnacle-core = { git = "https://github.com/flotilla-org/binnacle.git", rev = "963a7e84db30d9a3152fb23935963c55e27c82b2" }
binnacle-ffi = { git = "https://github.com/flotilla-org/binnacle.git", rev = "963a7e84db30d9a3152fb23935963c55e27c82b2" }
binnacle-memory = { git = "https://github.com/flotilla-org/binnacle.git", rev = "963a7e84db30d9a3152fb23935963c55e27c82b2" }
binnacle-described = { git = "https://github.com/flotilla-org/binnacle.git", rev = "963a7e84db30d9a3152fb23935963c55e27c82b2" }
binnacle-described-http = { git = "https://github.com/flotilla-org/binnacle.git", rev = "963a7e84db30d9a3152fb23935963c55e27c82b2" }
binnacle-layout = { git = "https://github.com/flotilla-org/binnacle.git", rev = "963a7e84db30d9a3152fb23935963c55e27c82b2" }
binnacle-format = { git = "https://github.com/flotilla-org/binnacle.git", rev = "963a7e84db30d9a3152fb23935963c55e27c82b2" }
binnacle-testkit = { git = "https://github.com/flotilla-org/binnacle.git", rev = "963a7e84db30d9a3152fb23935963c55e27c82b2" }
# Shared crates (flotilla ADR 0068), pinned once here.
flotilla-cbor = { git = "https://github.com/flotilla-org/rigging", rev = "0bc92eb3ea17d4a94af57bd6fcb661e3a41cc2ee" }
rigging-http-serve = { git = "https://github.com/flotilla-org/rigging", rev = "0bc92eb3ea17d4a94af57bd6fcb661e3a41cc2ee" }
rigging-http-client = { git = "https://github.com/flotilla-org/rigging", rev = "0bc92eb3ea17d4a94af57bd6fcb661e3a41cc2ee" }
rigging-http-wire = { git = "https://github.com/flotilla-org/rigging", rev = "0bc92eb3ea17d4a94af57bd6fcb661e3a41cc2ee" }
ansi_term = "0.12"
crossterm = "0.28.1"
insta = "1"
kdl = { version = "4.7.1", default-features = false }
ratatui = { version = "0.30.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.1.14"

conversation-events = { path = "crates/conversation-events" }
wheelhouse-agent = { path = "crates/wheelhouse-agent" }
wheelhouse-core = { path = "crates/wheelhouse-core" }
wheelhouse-rich-text = { path = "crates/wheelhouse-rich-text" }
wheelhouse-stream = { path = "crates/wheelhouse-stream" }
wheelhouse-surface = { path = "crates/wheelhouse-surface" }
wheelhouse-tables = { path = "crates/wheelhouse-tables" }
wheelhouse-terminal = { path = "crates/wheelhouse-terminal" }
wheelhouse-text = { path = "crates/wheelhouse-text" }
wheelhouse-tui = { path = "crates/wheelhouse-tui" }
