[workspace]
members = [
    "crates/wheelhouse-core",
    "crates/wheelhouse-rich-text",
    "crates/wheelhouse-stream",
    "crates/wheelhouse-arrangement-oracle",
    "crates/wheelhouse-glyph-cache",
    "crates/wheelhouse-ffi",
    "crates/wheelhouse-git-watcher",
    "crates/wheelhouse-html",
    "crates/wheelhouse-terminal",
    "crates/wheelhouse-tui",
    "crates/wheelhouse-ingress",
    "crates/wheelhouse-tables",
    "crates/wheelhouse-wasm",
    "crates/wheelhouse-text",
    "crates/wheelhouse-surface",
]
# tools/scenario is a workspace of its own: it pins Flotilla's crates by git
# revision, which normal builds shouldn't fetch.
exclude = ["tools/scenario"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# binnacle draws the tables (#505).
binnacle-core = { git = "https://github.com/flotilla-org/binnacle", branch = "main" }
binnacle-ffi = { git = "https://github.com/flotilla-org/binnacle", branch = "main" }
binnacle-memory = { git = "https://github.com/flotilla-org/binnacle", branch = "main" }
binnacle-described = { git = "https://github.com/flotilla-org/binnacle", branch = "main" }
binnacle-described-http = { git = "https://github.com/flotilla-org/binnacle", branch = "main" }
binnacle-layout = { git = "https://github.com/flotilla-org/binnacle", branch = "main" }
binnacle-format = { git = "https://github.com/flotilla-org/binnacle", branch = "main" }
binnacle-testkit = { git = "https://github.com/flotilla-org/binnacle", branch = "main" }
# Shared crates. Declared by branch, as rigging's README asks; Cargo.lock holds the commits.
flotilla-cbor = { git = "https://github.com/flotilla-org/rigging", branch = "main" }
rigging-http-serve = { git = "https://github.com/flotilla-org/rigging", branch = "main" }
rigging-http-client = { git = "https://github.com/flotilla-org/rigging", branch = "main", default-features = false }
rigging-http-wire = { git = "https://github.com/flotilla-org/rigging", branch = "main" }
# Tender's Binding paths (#789), at the revision flotilla pins for the publication it reads.
tender-types = { git = "https://github.com/flotilla-org/rigging", branch = "main" }
# Fearnought holds the Agent View protocol crates.
conversation-events = { git = "https://github.com/flotilla-org/fearnought", branch = "main" }
fearnought-client = { git = "https://github.com/flotilla-org/fearnought", branch = "main" }
ansi_term = "0.12"
crossterm = "0.28.1"
insta = "1"
kdl = { version = "4.7.1", default-features = false }
ratatui = { version = "0.30.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.1.14"

wheelhouse-core = { path = "crates/wheelhouse-core" }
wheelhouse-rich-text = { path = "crates/wheelhouse-rich-text" }
wheelhouse-stream = { path = "crates/wheelhouse-stream" }
wheelhouse-surface = { path = "crates/wheelhouse-surface" }
wheelhouse-tables = { path = "crates/wheelhouse-tables" }
wheelhouse-terminal = { path = "crates/wheelhouse-terminal" }
wheelhouse-text = { path = "crates/wheelhouse-text" }
wheelhouse-tui = { path = "crates/wheelhouse-tui" }
