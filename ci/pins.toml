# Cross-repo commits CI builds against. Bump them here, never in .github/workflows.
# `python ci/pins.py github-env` turns each entry into an `env = rev` line for
# $GITHUB_ENV; see ci/README.md. Binnacle is pinned in Cargo.toml, not here.
format = 1

[cleat]
env = "CLEAT_REV"
repo = "flotilla-org/cleat"
rev = "32c255eacb708feccd5a104925ca1517e4c23e54"
track = "manual"
# Views within an attachment (cleat#399, cleat#400): one attachment per
# session shared by every View of it (#417), additive on provider ABI 11;
# packet protocol 16, which only a client asking for views gets. Attaching
# with no default view fails against an older daemon: coordinate the Cleat
# fleet and daily-driver rollout (#97). Remote hosts need this Cleat for
# `cleat proxy` (#104). An exited session keeps its screen through resizes
# and reports how its program exited (cleat#406), shown in the View's pill.

[jackstay]
env = "JACKSTAY_REV"
repo = "flotilla-org/jackstay"
rev = "bdf1d39ee2d95fa663820d4eaed6b0bcfe8345ac"
track = "manual"
# Jackstay main: ABI 0.17, the v3 track handshake (jackstay#119) with
# affordances as a track.
