name: wheelhouse
version: 1.0.0
tier: project
provides: [toolchain:clang, dev:x11-gl]
requires: []
pins: {}
probe: |
  set -eu
  clang --version
  pkg-config --exists x11 xext gl egl freetype2
  work=$(mktemp -d)
  trap 'rm -rf "$work"' EXIT
  cat > "$work/probe.c" <<'C'
  #include <X11/Xlib.h>
  #include <X11/extensions/sync.h>
  #include <GL/gl.h>
  #include <GL/glx.h>
  #include <EGL/egl.h>
  #include <ft2build.h>
  #include FT_FREETYPE_H
  Display *(*volatile x11)(const char *) = XOpenDisplay;
  XSyncCounter (*volatile xext)(Display *, XSyncValue) = XSyncCreateCounter;
  const GLubyte *(*volatile gl)(GLenum) = glGetString;
  EGLDisplay (*volatile egl)(EGLNativeDisplayType) = eglGetDisplay;
  int main(void) {
    FT_Library library;
    if (FT_Init_FreeType(&library)) return 1;
    FT_Done_FreeType(library);
    return 0;
  }
  C
  clang "$work/probe.c" $(pkg-config --cflags --libs x11 xext gl egl freetype2) -o "$work/probe"
  "$work/probe"
context_files: []
build_secrets: []
